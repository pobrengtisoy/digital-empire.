<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0912">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your guest list pass</title>
<link rel="icon" type="image/svg+xml" href="../../rz-mark.svg">
<link rel="stylesheet" href="../fonts/gabi.css">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="passpage">
<div class="rz-strip" id="strip" hidden><a href="index.html">← Back to the RZ Gabi demo</a><span class="rz-strip-note"><b>RZ Gabi</b> demo · guest pass</span><a class="rz-buy" href="../../buy/?p=gabi">Buy</a></div>
<main class="pass" id="pass" hidden>
  <p class="pass-club neon" id="pClub"></p>
  <article class="ticket" aria-labelledby="pName">
    <header class="t-head">
      <p class="kicker">Guest list</p>
      <h1 id="pEvent"></h1>
      <p class="t-date" id="pDate"></p>
    </header>
    <div class="t-qr"><canvas id="qr" width="260" height="260" role="img" aria-label="QR code for your pass"></canvas></div>
    <p class="t-code" id="pCode"></p>
    <dl class="t-lines">
      <div><dt>Name</dt><dd id="pName"></dd></div>
      <div><dt>Guests</dt><dd id="pPlus"></dd></div>
      <div><dt>Doors</dt><dd id="pDoors"></dd></div>
    </dl>
    <p class="t-status" id="pStatus"></p>
  </article>
  <p class="pass-tip">Show this at the door with a valid ID. Screenshot it in case your signal drops.</p>
  <a class="cta ghost" id="backLink" href="index.html">Back to the club</a>
</main>
<main class="pass missing" id="missing" hidden><h1>Pass not found</h1><p id="missingText">This pass link is not valid.</p></main>
<script src="../kit.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module" src="pass.js"></script>
</body>
</html>
